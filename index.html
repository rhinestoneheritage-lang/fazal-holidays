  --ok:#5fd394; --ok-bg:#123524; --warn:#ffbf66; --warn-bg:#3a2a10; --bad:#ff7b80; --bad-bg:#3c1518; --info-bg:#1e2763;

:root[data-theme="dark"]{
  --navy:#3348b8; --navy-ink:#9fb0ff; --red:#ff5a60; --saffron:#ffa53d; --sky:#58a8ff;
  --bg:#0d1029; --surface:#151a3d; --surface2:#1b2149; --ink:#e9ebf8; --muted:#9ba2c9; --line:#2a3166;
  --ok:#5fd394; --ok-bg:#123524; --warn:#ffbf66; --warn-bg:#3a2a10; --bad:#ff7b80; --bad-bg:#3c1518; --info-bg:#1e2763;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
/* rail */
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;padding:14px 12px 18px}
.brand{background:#fff;border-radius:14px;padding:10px 10px 6px;text-align:center;border:1px solid var(--line)}
.brand img{width:100%;max-width:170px;display:block;margin:0 auto}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:14px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 11px;border-radius:10px;cursor:pointer;text-align:left;color:var(--muted);font-weight:500}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button.on{background:var(--navy);color:#fff}
.nav .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:600;border-radius:20px;padding:0 7px;line-height:18px}
.nav .sep{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 11px 4px;opacity:.8}
.railfoot{margin-top:auto;padding-top:14px;font-size:12px;color:var(--muted)}
/* main */
.main{min-width:0;padding-block:20px 60px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1180px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-family:var(--f-display);font-weight:800;font-size:26px;margin:0;letter-spacing:-.01em;color:var(--navy-ink);text-wrap:balance}
.top .sub{color:var(--muted);font-size:14px;width:100%;margin-top:-6px}
.top .sp{flex:1}
.mbar{display:none}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
a.btn{text-decoration:none}
.btn:hover{border-color:var(--navy-ink)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff}
.btn svg{width:16px;height:16px}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.panel h3{font-family:var(--f-display);font-size:15px;font-weight:700;margin:0;padding:14px 16px 10px;display:flex;align-items:center;gap:8px}
.panel h3 .sp{flex:1}
.pb{padding:0 16px 16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:24px;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .h{font-size:13px;color:var(--muted)}
.kpi.red .v{color:var(--red)} .kpi.nv .v{color:var(--navy-ink)} .kpi.sf .v{color:var(--saffron)}
/* toolbar */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tools input[type=search],.tools select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 11px;min-width:0}
.tools input[type=search]{flex:1 1 220px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tabs button .n{opacity:.7;margin-left:4px}
/* table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface2)}
tr.click{cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:13px}
.strong{font-weight:600}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:20px;padding:1px 9px;white-space:nowrap;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.c-ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.c-warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.c-bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.c-info{background:var(--info-bg);color:var(--navy-ink);border-color:transparent}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
/* follow-up cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.over{border-left:4px solid var(--red)}
.card.tod{border-left:4px solid var(--saffron)}
.card .t{display:flex;gap:8px;align-items:baseline}
.card .nm{font-weight:600;font-size:16px;flex:1;min-width:0;overflow-wrap:anywhere}
.card .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.card .note{font-size:13px;background:var(--surface2);border-radius:8px;padding:6px 9px}
.card .act{display:flex;gap:6px;flex-wrap:wrap}
/* bars */
.bar{height:8px;border-radius:5px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--navy)}
.bar i.full{background:var(--red)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
/* package cards */
.pk{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pk .hd{padding:14px 15px 10px;border-bottom:1px dashed var(--line)}
.pk .dest{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--red);font-weight:600}
.pk .pn{font-family:var(--f-display);font-weight:800;font-size:19px;color:var(--navy-ink);line-height:1.15;margin-top:2px}
.pk .pr{font-family:var(--f-display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.pk .pr small{font-size:13px;color:var(--muted);font-weight:600}
.pk .bd{padding:10px 15px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.inc{display:flex;flex-wrap:wrap;gap:4px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(8,10,30,.55);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:max(20px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 40px max(12px,env(safe-area-inset-left,0px))}
.md{background:var(--surface);border-radius:16px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.35);border:1px solid var(--line)}
.md.wide{max-width:960px}
.md .mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.md .mh h2{font-family:var(--f-display);font-size:18px;margin:0;flex:1;color:var(--navy-ink)}
.md .mb{padding:16px 18px}
.md .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:8px 10px;width:100%}
.fld textarea{min-height:76px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:500;cursor:pointer;background:var(--surface2)}
.sub-h{font-family:var(--f-display);font-weight:700;font-size:14px;margin:18px 0 8px;color:var(--navy-ink);grid-column:1/-1}
.rows{display:flex;flex-direction:column;gap:6px;grid-column:1/-1}
.rowi{display:grid;gap:6px;align-items:center}
.rowi input,.rowi select{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:6px 8px;width:100%;min-width:0}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-variant-numeric:tabular-nums;background:var(--surface2);border-radius:10px;padding:10px 14px;grid-column:1/-1}
.sum .tot{font-weight:700;font-size:17px;border-top:1px solid var(--line);padding-top:4px}
.toast{position:fixed;bottom:max(18px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:10px;font-weight:600;z-index:80;font-size:14px}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.mi{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.mi img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--surface2);cursor:zoom-in}
.mi .c{padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.reply{white-space:pre-wrap;font-size:14px;background:var(--surface2);border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
.notes{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.notes div{font-size:13px;border-left:3px solid var(--line);padding-left:9px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.example{font-size:11px;background:var(--warn-bg);color:var(--warn);padding:1px 6px;border-radius:5px;font-weight:600;margin-left:6px;vertical-align:middle}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.notice .sp{flex:1}
/* invoice */
.inv{background:#fff;color:#151a3b;padding:26px;font-size:13.5px;border-radius:10px;border:1px solid #e0e3f0}
.inv .ih{display:flex;gap:16px;align-items:flex-start;border-bottom:3px solid #1b2a78;padding-bottom:12px}
.inv .ih img{width:120px}
.inv .ih .bz{flex:1;text-align:right;font-size:12.5px;color:#444a70}
.inv .ih .bz b{font-family:var(--f-display);font-size:20px;color:#1b2a78;display:block}
.inv .tt{display:flex;justify-content:space-between;gap:12px;margin:14px 0;flex-wrap:wrap}
.inv .tt h4{margin:0 0 3px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#d6262e}
.inv table th{background:#1b2a78;color:#fff;border:0}
.inv table td{border-bottom:1px solid #e3e6f2}
.inv .itot{margin-left:auto;width:280px;max-width:100%;margin-top:10px}
.inv .itot div{display:flex;justify-content:space-between;padding:3px 0}
.inv .itot .g{font-weight:700;font-size:16px;border-top:2px solid #1b2a78;padding-top:6px;color:#1b2a78}
.inv .ft{display:flex;justify-content:space-between;gap:20px;margin-top:22px;font-size:12px;color:#555b80;flex-wrap:wrap}
.inv .stamp{display:inline-block;border:2px solid #1f8a4c;color:#1f8a4c;font-weight:700;padding:2px 10px;border-radius:6px;transform:rotate(-4deg)}
#printArea{display:none}
@media print{
  body{background:#fff}
  .app,.ov,.toast{display:none!important}
  #printArea{display:block}
  #printArea .inv{border:0;padding:0}
}
/* responsive */
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-105%);transition:transform .2s;height:100%;padding-top:max(14px,env(safe-area-inset-top,0px))}
  .rail.open{transform:none;box-shadow:0 0 0 100vmax rgba(8,10,30,.45)}
  .mbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--surface)}
  .mbar img{height:34px;background:#fff;border-radius:8px;padding:2px 6px}
  .mbar b{font-family:var(--f-display);color:var(--navy-ink);flex:1}
  .g2,.g3{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .top h1{font-size:22px}
}
@media (max-width:460px){.kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:20px}.cards{grid-template-columns:1fr}}

<script>
/* ============ Storage (IndexedDB, falls back to memory) ============ */
const VERSION='1.0';
const IDB={db:null,mem:{},
  open(){return new Promise(r=>{try{const q=indexedDB.open('fazal-holidays',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{this.db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})},
  get(k){return new Promise(r=>{if(!this.db)return r(this.mem[k]);try{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(undefined)}catch(e){r(this.mem[k])}})},
  set(k,v){this.mem[k]=v;return new Promise(r=>{if(!this.db)return r();try{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>r();t.onerror=()=>r()}catch(e){r()}})},
  del(k){delete this.mem[k];return new Promise(r=>{if(!this.db)return r();try{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>r();t.onerror=()=>r()}catch(e){r()}})}
};
let DB=null; let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>IDB.set('db',JSON.parse(JSON.stringify(DB))),150)}

/* ============ Helpers ============ */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const rs=n=>'₹'+Math.round(+n||0).toLocaleString('en-IN');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=s=>{if(!s)return '';const d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})};
const fdS=s=>{if(!s)return '';const d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})};
const byId=(c,id)=>DB[c].find(x=>x.id===id);
const phoneClean=p=>{let d=String(p||'').replace(/\D/g,'');if(d.length===10)d='91'+d;return d};
const waLink=(p,t)=>'https://wa.me/'+phoneClean(p)+'?text='+encodeURIComponent(t||'');
const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('Copied')}catch(e){showText('Copy this',text)}}

/* ============ Calculations ============ */
function bk(b){
  const gross=(+b.adults||0)*(+b.rate||0)+(+b.children||0)*(+b.childRate||0)+(+b.extra||0)-(+b.discount||0);
  const gst=b.gstOn?gross*(+DB.settings.gstPct||0)/100:0;
  const total=gross+gst; const paid=(b.payments||[]).reduce((a,p)=>a+(+p.amount||0),0);
  const cost=(b.vendorCosts||[]).reduce((a,v)=>a+(+v.amount||0),0);
  const pax=(+b.adults||0)+(+b.children||0);
  return {gross,gst,total,paid,bal:total-paid,cost,profit:gross-cost-(+b.commission||0),pax};
}
function seatsBooked(depId){return DB.bookings.filter(b=>b.departureId===depId&&b.status!=='Cancelled').reduce((a,b)=>a+bk(b).pax,0)}
const custName=id=>byId('customers',id)?.name||'—';
const pkgName=id=>byId('packages',id)?.name||'Custom trip';
function nextCode(kind){const s=DB.settings;if(kind==='inv'){const c=s.invPrefix+String(s.nextInv).padStart(4,'0');s.nextInv++;return c}const c=s.bookPrefix+String(s.nextBook).padStart(4,'0');s.nextBook++;return c}

R.invoices=()=>{
  const tab=ST.tab||'inv',m=ST.month||today().slice(0,7);
  if(tab==='pay'){
    const pays=DB.bookings.flatMap(b=>(b.payments||[]).map((p,i)=>({p,b,i}))).filter(x=>(x.p.date||'').slice(0,7)===m).sort((a,b)=>b.p.date.localeCompare(a.p.date));
    const byMode={};pays.forEach(x=>byMode[x.p.mode]=(byMode[x.p.mode]||0)+(+x.p.amount||0));
    return head('Invoices & Payments','')+tabsIP(tab,m)+`<div class="kpis">${Object.entries(byMode).map(([k,v])=>`<div class="kpi"><div class="l">${esc(k)}</div><div class="v">${rs(v)}</div></div>`).join('')}<div class="kpi nv"><div class="l">Total received</div><div class="v">${rs(pays.reduce((a,x)=>a+(+x.p.amount||0),0))}</div></div></div>
    <div class="panel tw"><table><thead><tr><th>Date</th><th>Booking</th><th>Customer</th><th>Mode</th><th>Ref</th><th class="num">Amount</th><th></th></tr></thead><tbody>${pays.map(x=>`<tr><td>${fd(x.p.date)}</td><td>${esc(x.b.code)}</td><td>${esc(custName(x.b.customerId))}</td><td>${esc(x.p.mode)}</td><td class="small muted">${esc(x.p.ref||'')}</td><td class="num strong">${rs(x.p.amount)}</td><td><button class="btn sm" data-act="receipt" data-id="${x.b.id}" data-i="${x.i}">Receipt</button></td></tr>`).join('')||'<tr><td colspan="7"><div class="empty">Is mahine koi payment nahi</div></td></tr>'}</tbody></table></div>`;
  }
  const list=DB.bookings.filter(b=>tab==='inv'?b.invNo:!b.invNo&&b.status!=='Cancelled').sort((a,b)=>(b.invNo||b.code).localeCompare(a.invNo||a.code));
  return head('Invoices & Payments','')+tabsIP(tab,m)+`<div class="panel tw"><table><thead><tr><th>${tab==='inv'?'Invoice':'Booking'}</th><th>Date</th><th>Customer</th><th>Package</th><th class="num">Total</th><th class="num">Balance</th><th></th></tr></thead><tbody>
  ${list.map(b=>{const k=bk(b);return `<tr><td class="strong">${esc(tab==='inv'?b.invNo:b.code)}${exTag(b)}</td><td>${fd(b.invDate||b.createdAt)}</td><td>${esc(custName(b.customerId))}</td><td>${esc(pkgName(b.packageId))}</td><td class="num">${rs(k.total)}</td><td class="num" style="color:${k.bal>0?'var(--bad)':'var(--ok)'}">${k.bal>0?rs(k.bal):'Paid'}</td><td><button class="btn sm ${tab==='inv'?'':'navy'}" data-act="invoice" data-id="${b.id}">${tab==='inv'?'View':'Make invoice'}</button></td></tr>`}).join('')||'<tr><td colspan="7"><div class="empty"><b>Kuch nahi mila</b>Booking open karke "Invoice" dabayein.</div></td></tr>'}</tbody></table></div>`;
};

function invText(b){const k=bk(b);return `*${DB.settings.name}* — Invoice ${b.invNo}\nDate: ${fd(b.invDate)}\nCustomer: ${custName(b.customerId)}\nTrip: ${pkgName(b.packageId)} · ${fd(b.travelDate)} · ${k.pax} pax\nTotal: ${rs(k.total)}\nReceived: ${rs(k.paid)}\nBalance: ${k.bal>0?rs(k.bal):'PAID'}\n\n${DB.settings.contacts}`}
function showInvoice(id){
  const b=byId('bookings',id);if(!b.invNo){b.invNo=nextCode('inv');b.invDate=today();save();renderNav();}
  const c=byId('customers',b.customerId);
  modal('Invoice '+esc(b.invNo),`<div class="tw">${invHTML(b,'invoice')}</div>${inFrame?'<p class="small muted">Print / PDF button aapke apne domain (Cloudflare) par chalega. Yahan preview me "Copy text" ya WhatsApp use karein.</p>':''}`,
   [inFrame?null:['Print / Save PDF','navy',()=>{$('#printArea').innerHTML=invHTML(b,'invoice');window.print()}],['Copy text','',()=>copy(invText(b))],['WhatsApp','wa',()=>window.open(waLink(c?.phone,invText(b)),'_blank')]].filter(Boolean),true);
  render();

function parseCSV(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'&&t[i+1]=='"'){f+='"';i++}else if(ch=='"')q=false;else f+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(f);f=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=ch}if(f||r.length){r.push(f);rows.push(r)}return rows.filter(r=>r.some(x=>x.trim()))}
function importCSV(file,kind){const fr=new FileReader();fr.onload=()=>{const rows=parseCSV(fr.result);if(rows.length<2){toast('CSV khali hai');return}const h=rows[0].map(x=>x.trim().toLowerCase());const col=(r,...names)=>{for(const n of names){const i=h.findIndex(x=>x.includes(n));if(i>=0)return (r[i]||'').trim()}return ''};let n=0,skip=0;
  const dt=s=>{if(!s)return '';if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);const m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}return ''};
  rows.slice(1).forEach(r=>{const name=col(r,'name'),phone=col(r,'phone','mobile','number','contact');if(!name&&!phone)return;
    if(kind==='cust'){if(DB.customers.some(c=>phone&&phoneClean(c.phone)===phoneClean(phone))){skip++;return}DB.customers.push({id:uid(),name,phone,city:col(r,'city'),area:col(r,'area','locality'),branch:col(r,'office','branch')||DB.settings.branches[0],notes:col(r,'note'),type:'Customer',createdAt:today()})}
    else DB.leads.push({id:uid(),name,phone,city:col(r,'city'),destination:col(r,'destination','place'),travelDate:dt(col(r,'travel')),pax:+col(r,'pax','person')||'',source:col(r,'source')||'Old data',status:LSTAT.find(s=>s.toLowerCase()===col(r,'status').toLowerCase())||'New',nextFollow:dt(col(r,'next','follow')),notes:col(r,'note')?[{d:today(),text:col(r,'note')}]:[],createdAt:today()});n++});
  save();render();toast(`${n} imported${skip?', '+skip+' duplicate skipped':''}`)};fr.readAsText(file)}

function fieldHTML(f,val){

  let inp;
  if(f.t==='select')inp=`<select id="${id}" name="${f.k}">${f.o.map(o=>{const [ov,ol]=Array.isArray(o)?o:[o,o];return `<option value="${esc(ov)}" ${String(ov)===String(v)?'selected':''}>${esc(ol)}</option>`}).join('')}</select>`;
  else if(f.t==='textarea')inp=`<textarea id="${id}" name="${f.k}">${esc(v)}</textarea>`;
  else if(f.t==='checks')return `<div class="fld full"><label>${esc(f.l)}</label><div class="checks">${f.o.map(o=>`<label><input type="checkbox" name="${f.k}" value="${esc(o)}" ${(v||[]).includes(o)?'checked':''}>${esc(o)}</label>`).join('')}<input class="addinc" placeholder="+ other" style="border:1px dashed var(--line);border-radius:20px;padding:3px 10px;width:120px;background:none" aria-label="Add other inclusion"></div></div>`;
  else inp=`<input id="${id}" name="${f.k}" type="${f.t||'text'}" value="${esc(v)}" ${f.list?`list="dl_${f.k}"`:''} ${f.t==='number'?'step="any" inputmode="decimal"':''}>${f.list?`<datalist id="dl_${f.k}">${[...new Set(f.list)].map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`:''}`;
  return `<div class="fld ${f.full?'full':''}">${L}${inp}</div>`;
}

function modal(title,body,actions=[],wide){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="md ${wide?'wide':''}" role="dialog" aria-modal="true"><div class="mh"><h2>${title}</h2><button class="btn sm ghost" data-close aria-label="Close">✕</button></div><div class="mb">${body}</div>${actions.length?`<div class="mf">${actions.map((a,i)=>`<button class="btn ${a[1]}" data-ai="${i}" ${a[0]==='Delete'?'style="margin-right:auto;color:var(--bad)"':''}>${a[0]}</button>`).join('')}</div>`:''}</div>`;
  $('#modalRoot').innerHTML='';$('#modalRoot').appendChild(ov);
  ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('[data-close]'))closeModal();const a=e.target.closest('[data-ai]');if(a){const fn=actions[+a.dataset.ai][2];closeModal();fn()}
    const cp=e.target.closest('[data-copy]');if(cp)copy(decodeURIComponent(cp.dataset.copy));const r=e.target.closest('[data-act]');if(r&&!a)handleAct(r)});
  return ov;
}
function closeModal(){$('#modalRoot').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function formModal(title,fields,init,onSave,opt={}){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="md ${opt.wide?'wide':''}" role="dialog" aria-modal="true"><form id="mForm" novalidate><div class="mh"><h2>${title}</h2><button type="button" class="btn sm ghost" data-close aria-label="Close">✕</button></div><div class="mb"><div class="form">${fields.map(f=>fieldHTML(f,init?.[f.k])).join('')}</div><div id="mErr" class="small" style="color:var(--bad);margin-top:8px"></div></div><div class="mf">${(opt.extra||[]).map((a,i)=>`<button type="button" class="btn" data-ex="${i}" style="margin-right:auto;color:var(--bad)">${a[0]}</button>`).join('')}<button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn pri">Save</button></div></form></div>`;
  $('#modalRoot').innerHTML='';$('#modalRoot').appendChild(ov);
  ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('[data-close]'))closeModal();const x=e.target.closest('[data-ex]');if(x){closeModal();opt.extra[+x.dataset.ex][2]()}});
  ov.querySelectorAll('.addinc').forEach(inp=>inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const v=inp.value.trim();if(!v)return;const nm=inp.closest('.fld').querySelector('input[type=checkbox]').name;const l=document.createElement('label');l.innerHTML=`<input type="checkbox" name="${nm}" value="${esc(v)}" checked>${esc(v)}`;inp.before(l);inp.value=''}}));
  const form=$('#mForm');
  form.addEventListener('submit',e=>{e.preventDefault();const v=collect(form);const miss=fields.filter(f=>f.req&&!String(v[f.k]||'').trim());if(miss.length){$('#mErr').textContent='Ye bharna zaroori hai: '+miss.map(f=>f.l).join(', ');return}
    for(const k in v)if(k.startsWith('_'))delete v[k];if(onSave(v)!==false)closeModal()});
  opt.onOpen&&opt.onOpen();setTimeout(()=>form.querySelector('input,select,textarea')?.focus(),30);
}
function confirmDel(coll,id){const it=byId(coll,id);modal('Delete karna hai?',`<p><b>${esc(it.name||it.title||it.code||'')}</b> recycle bin me chala jayega. Backup page se wapas la sakte hain.</p>`,[['Cancel','',()=>{}],['Delete','pri',()=>{DB[coll]=DB[coll].filter(x=>x.id!==id);DB.trash.unshift({coll,item:it,at:new Date().toISOString()});DB.trash=DB.trash.slice(0,200);save();render();toast('Deleted')}]])}
function showText(t,txt){modal(t,`<textarea style="width:100%;min-height:240px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface2)" readonly onfocus="this.select()">${esc(txt)}</textarea><p class="small muted">Select karke copy kar lijiye.</p>`)}

/* ============ Event binding ============ */
function handleAct(el){const a=el.dataset.act,id=el.dataset.id;
  const map={newLead:()=>editLead(),newBooking:()=>editBooking(),newCust:()=>editCust(),newPkg:()=>editPkg(),newParty:()=>editParty(),newExp:()=>editExp(),newReply:()=>editReply(),
   leadOpen:()=>leadOpen(id),leadNote:()=>leadNote(id),leadBook:()=>leadBook(id),leadReply:()=>pickReply({lead:byId('leads',id)}),
   custOpen:()=>custOpen(id),bookOpen:()=>bookOpen(id),pkgEdit:()=>editPkg(id),pkgShare:()=>{const p=byId('packages',id);showText('Package share text',pkgText(p))},pkgDeps:()=>pkgDeps(id),
   pkgBook:()=>{const p=byId('packages',id);editBooking(null,{packageId:id,rate:p.pricePP,childRate:p.childPrice||0})},
   invoice:()=>showInvoice(id),receipt:()=>showReceipt(id,+el.dataset.i),partyEdit:()=>editParty(id),expEdit:()=>editExp(id),
   replyEdit:()=>editReply(id),copyReply:()=>copy(byId('replies',id).text),mEdit:()=>editMedia(id),mView:()=>viewMedia(id),
   exportAll:()=>exportData(true),exportLite:()=>exportData(false),exportCust:()=>{const rows=[['name','phone','city','area','office','notes'],...DB.customers.map(c=>[c.name,c.phone,c.city,c.area,c.branch,c.notes])];const t=rows.map(r=>r.map(x=>'"'+String(x||'').replace(/"/g,'""')+'"').join(',')).join('\n');if(inFrame)showText('Customers CSV',t);else{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));l.download='fazal-customers.csv';l.click()}},
   restore:()=>{const t=DB.trash.splice(+el.dataset.i,1)[0];DB[t.coll].push(t.item);save();render();toast('Restored')},
   clearEx:()=>modal('Sample data hatana hai?','<p>Example customers, enquiries, bookings aur parties hat jayenge. Packages aur saved replies rahenge.</p>',[['Cancel','',()=>{}],['Hatao','pri',()=>{['customers','leads','bookings','parties'].forEach(c=>DB[c]=DB[c].filter(x=>!x.example));DB.meta.seeded=false;DB.settings.nextBook=1;DB.settings.nextInv=1;save();render();toast('Sample data removed')}]])};
  map[a]&&map[a]();
}
function bindView(){
  const v=$('#view');
  v.onclick=e=>{const g=e.target.closest('[data-go]');if(g)return go(g.dataset.go);const s=e.target.closest('[data-st]');if(s){ST[s.dataset.st]=s.dataset.val;return render()}const a=e.target.closest('[data-act]');if(a&&!a.matches('a'))handleAct(a)};
  const q=$('#q');if(q){q.oninput=()=>{ST.q=q.value;const pos=q.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)}}
  const sel=(id,key)=>{const el=$(id);if(el)el.onchange=()=>{ST[key]=el.value;render()}};sel('#fdest','dest');sel('#fcity','city');sel('#fbranch','branch');sel('#fpkg','pkg');sel('#fmonth','month');
  const so=$('#showOld');if(so)so.onchange=()=>{ST.showOld=so.checked;render()};
  const up=$('#mUp');if(up)up.onchange=()=>uploadMedia([...up.files]);
  const rf=$('#restoreFile');if(rf)rf.onchange=()=>rf.files[0]&&restoreFile(rf.files[0]);
  const cc=$('#csvCust');if(cc)cc.onchange=()=>cc.files[0]&&importCSV(cc.files[0],'cust');
  const cl=$('#csvLead');if(cl)cl.onchange=()=>cl.files[0]&&importCSV(cl.files[0],'lead');
  const sf=$('#setForm');if(sf)sf.onsubmit=e=>{e.preventDefault();const o=collect(sf);const L=s=>s.split('\n').map(x=>x.trim()).filter(Boolean);
    Object.assign(DB.settings,o,{offices:L(o.offices),staff:L(o.staff),branches:L(o.branches),sources:L(o.sources),gstPct:+o.gstPct||0,nextInv:+o.nextInv||1,nextBook:+o.nextBook||1});save();render();toast('Settings saved')};
  if(VIEW==='media')loadThumbs();
}

/* ============ Boot ============ */
(async()=>{await IDB.open();DB=await IDB.get('db');if(!DB||!DB.settings){DB=seed(freshDB());save()}
  const f=freshDB();for(const k in f)if(DB[k]===undefined)DB[k]=f[k];
  const h=(location.hash||'').slice(1);if(VIEWS.some(v=>v[0]===h))VIEW=h;render()})();
</script>
